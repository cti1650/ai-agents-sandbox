# AI Agents Sandbox - tmux configuration
# Optimized for long-running AI agent sessions

# Basic settings
set -g mouse on                    # Enable mouse support
set -g history-limit 50000         # Large scrollback buffer for AI output
set -g base-index 1                # Start window numbering from 1
setw -g pane-base-index 1          # Start pane numbering from 1

# Status bar
set -g status-position bottom
set -g status-style 'bg=colour235 fg=colour255'
set -g status-left '[#S] '
set -g status-right '%Y-%m-%d %H:%M '
set -g status-left-length 20

# Window status
setw -g window-status-current-style 'bg=colour39 fg=colour232 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'bg=colour235 fg=colour250'
setw -g window-status-format ' #I:#W '

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Faster escape time (for vim/neovim users)
set -sg escape-time 10

# Enable 256 colors
set -g default-terminal "screen-256color"

# Keep window names fixed (don't auto-rename)
set -g allow-rename off

# Increase message display time
set -g display-time 4000

# Refresh status more often
set -g status-interval 5

# Key bindings
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt + arrow keys (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
