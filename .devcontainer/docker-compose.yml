services:
  ai-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Workspace
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-ai-agents-sandbox}:cached

      # NOTE: host ~/.ssh and ~/.gitconfig are intentionally NOT bind-mounted.
      # VS Code Dev Containers shares Git config and forwards the SSH agent
      # automatically, so no host-side pre-creation is required and the macOS
      # "UseKeychain" config no longer breaks SSH inside the container.

      # Persist AI agent auth data across container rebuilds
      - claude-auth:/home/vscode/.claude
      - codex-auth:/home/vscode/.codex
      - antigravity-auth:/home/vscode/.gemini

      # Mount Claude Code config from host (read-only, overlays on top of named volume)
      # Symlinks in ~/.claude are resolved by Docker automatically
      # NOTE: settings.json is NOT mounted - container uses its own autonomous settings
      - ~/.claude/skills:/home/vscode/.claude/skills:ro
      - ~/.claude/agents:/home/vscode/.claude/agents:ro
      - ~/.claude/rules:/home/vscode/.claude/rules:ro
      - ~/.claude/commands:/home/vscode/.claude/commands:ro
      - ~/.claude/workflows:/home/vscode/.claude/workflows:ro
      - ~/.claude/output-styles:/home/vscode/.claude/output-styles:ro
      - ~/.claude/themes:/home/vscode/.claude/themes:ro
      - ~/.claude/keybindings.json:/home/vscode/.claude/keybindings.json:ro
      - ~/.claude/CLAUDE.md:/home/vscode/.claude/CLAUDE.md:ro

      # Mount Codex CLI config from host (read-only, overlays on top of named volume)
      # NOTE: config.toml is NOT mounted - container uses its own autonomous settings
      - ~/.codex/AGENTS.md:/home/vscode/.codex/AGENTS.md:ro
      - ~/.codex/skills:/home/vscode/.codex/skills:ro
      - ~/.codex/plugins:/home/vscode/.codex/plugins:ro
      - ~/.codex/rules:/home/vscode/.codex/rules:ro

      # Mount Antigravity CLI config from host (read-only, overlays on top of named volume)
      # Note: Antigravity CLI uses ~/.gemini/ directory
      # NOTE: settings.json is NOT mounted - container uses its own autonomous settings
      - ~/.gemini/GEMINI.md:/home/vscode/.gemini/GEMINI.md:ro
      - ~/.gemini/AGENTS.md:/home/vscode/.gemini/AGENTS.md:ro
      - ~/.gemini/config:/home/vscode/.gemini/config:ro
      - ~/.gemini/skills:/home/vscode/.gemini/skills:ro
      - ~/.gemini/antigravity-cli/keybindings.json:/home/vscode/.gemini/antigravity-cli/keybindings.json:ro
      - ~/.gemini/antigravity-cli/skills:/home/vscode/.gemini/antigravity-cli/skills:ro
      - ~/.gemini/antigravity-cli/plugins:/home/vscode/.gemini/antigravity-cli/plugins:ro

    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    # Security: Read-only root filesystem (with tmpfs for writable areas)
    read_only: false  # Set to true for maximum security, but may break some tools
    tmpfs:
      - /tmp:exec,mode=1777
      - /run:exec,mode=1777

    # Security: No privilege escalation
    security_opt:
      - no-new-privileges:true

    # Resource limits (kept modest so low-spec machines can run the container).
    # Raise these if you have headroom and want faster builds.
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
          pids: 256  # Prevent fork bombs

    # Health check to verify container is working
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Keep container running
    command: sleep infinity

    # Environment variables (loaded from .env file if exists)
    env_file:
      - path: ../.env
        required: false

# Named volumes for persisting auth data
volumes:
  claude-auth:
  codex-auth:
  antigravity-auth:
