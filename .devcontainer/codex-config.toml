# Codex CLI - Container Autonomous Settings
# This config enables autonomous execution within the DevContainer.
# Security is provided by container isolation + deny rules.

# Auto-approve all operations (container is isolated)
approval_policy = "never"

# Allow writes to workspace (safe within container)
sandbox_mode = "workspace-write"

[features]
# Network proxy settings can be added here if needed

[rules]
# Block dangerous commands
[[rules.commands]]
pattern = "rm -rf /"
decision = "forbidden"

[[rules.commands]]
pattern = "rm -rf ~"
decision = "forbidden"

[[rules.commands]]
pattern = "rm -rf /*"
decision = "forbidden"

[[rules.commands]]
pattern = "sudo *"
decision = "forbidden"

[[rules.commands]]
pattern = "chmod -R 777 /"
decision = "forbidden"

[[rules.commands]]
pattern = "curl * | bash"
decision = "forbidden"

[[rules.commands]]
pattern = "curl * | sh"
decision = "forbidden"

[[rules.commands]]
pattern = "wget * | bash"
decision = "forbidden"

[[rules.commands]]
pattern = "wget * | sh"
decision = "forbidden"

[[rules.commands]]
pattern = "npm publish*"
decision = "forbidden"

[[rules.commands]]
pattern = "pnpm publish*"
decision = "forbidden"

[[rules.commands]]
pattern = "git push --force*"
decision = "forbidden"

[[rules.commands]]
pattern = "git push -f *"
decision = "forbidden"

[[rules.commands]]
pattern = "git reset --hard*"
decision = "forbidden"

[[rules.commands]]
pattern = "git clean -fd*"
decision = "forbidden"

# Activate the "container" permission profile below.
default_permissions = "container"

# Deny reading sensitive files.
# NOTE: codex expects `filesystem` to be a TABLE keyed by glob -> access mode
# (read|write|deny), NOT an array of { path, access } entries. Using an array
# fails config loading with: invalid type: sequence, expected struct
# FilesystemPermissionsToml in `permissions`, which prevents codex from starting.
[permissions.container.filesystem]
"**/.env"          = "deny"
"**/.env.local"    = "deny"
"**/.env.*.local"  = "deny"
"**/secrets/**"    = "deny"
"**/*credentials*" = "deny"
"**/*.pem"         = "deny"
"**/*.key"         = "deny"
"**/id_rsa*"       = "deny"
"/etc/shadow"      = "deny"
"/etc/passwd"      = "deny"
