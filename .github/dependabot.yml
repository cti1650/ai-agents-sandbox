version: 2
updates:
  # Keep GitHub Actions pinned to commit SHAs, but auto-open PRs that bump
  # the pinned SHA (and the version comment) when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
