version: 2
updates:
  # Keep GitHub Actions pinned to commit SHAs, but auto-open PRs that bump
  # the pinned SHA (and the version comment) when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Keep the pinned base image (FROM ...@sha256) digest current.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    # node is the runtime foundation of the whole environment. Do not chase
    # major bumps automatically (e.g. 24 -> 26); upgrade those deliberately
    # after verifying the bundled CLIs. Patch/minor and digest updates within
    # the current major are still proposed.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
