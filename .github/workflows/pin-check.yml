name: Pin Check

# Enforce that every GitHub Action is pinned to a full commit SHA (and that
# the "# vX.Y.Z" comment matches that SHA). Complements Dependabot: Dependabot
# keeps pins current, this fails CI if a new/edited workflow introduces an
# unpinned or mismatched action.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify actions are SHA-pinned
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          skip_push: "true"
