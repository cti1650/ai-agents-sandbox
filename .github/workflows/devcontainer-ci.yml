name: DevContainer CI

# Build the DevContainer and run the verification smoke test on every push
# to main and on pull requests. This is the core guarantee of this repo:
# if the container or any bundled AI CLI breaks, the build goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # docker-compose.yml bind-mounts ~/.ssh and ~/.gitconfig (read-only).
      # On a fresh CI runner these may not exist; pre-create them so Docker
      # doesn't auto-create ~/.gitconfig as a directory and break Git.
      - name: Prepare host mounts
        run: |
          mkdir -p ~/.ssh
          touch ~/.gitconfig

      - name: Build devcontainer and run verification
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          # postCreateCommand already runs verify.sh; run it again explicitly
          # so the job's pass/fail is tied directly to the smoke test.
          runCmd: bash scripts/verify.sh
          push: never
