name: DevContainer CI

# Build the DevContainer and run the verification smoke test on every push
# to main and on pull requests. This is the core guarantee of this repo:
# if the container or any bundled AI CLI breaks, the build goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build devcontainer and run verification
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          # postCreateCommand already runs verify.sh; run it again explicitly
          # so the job's pass/fail is tied directly to the smoke test.
          # workspaceFolder is workspace/, so cd to repo root first.
          runCmd: cd $REPO_ROOT && bash scripts/verify.sh
          push: never
