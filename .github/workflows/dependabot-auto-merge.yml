name: Dependabot Auto-merge

# Auto-merge Dependabot PRs once required checks pass. Scope is deliberately
# conservative: minor / patch / digest updates merge themselves, but major
# version bumps are left for a human to review (same caution the Dependabot
# config already applies to the node base image). The actual merge is gated on
# branch protection / required status checks via `gh pr merge --auto`, so a red
# DevContainer CI or Pin Check still blocks the merge.

on:
  pull_request:

# No ambient permissions; the single job below requests exactly what it needs.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # contents: write -> let GitHub merge once checks pass.
    # pull-requests: write -> enable auto-merge on the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
