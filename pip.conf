# Takumi Guard (GMO Flatt Security) - anonymous / blocking-only mode for PyPI.
# Routing pip through this index blocks known-malicious packages AND applies
# an automatic 72h (3-day) quarantine on newly published versions, so a freshly
# published malicious release cannot be installed before it is detected/pulled.
# No account/token is needed; download tracking and breach notifications are
# not available in anonymous mode.
# Docs: https://shisho.dev/docs/ja/t/guard/quickstart/pypi/
#
# Applied to pip via PIP_CONFIG_FILE in .devcontainer/devcontainer.json
# (pip does not auto-read a project-directory config the way npm reads .npmrc).
[global]
index-url = https://pypi.flatt.tech/simple/
